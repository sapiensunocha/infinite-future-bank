name: Build Android App Bundle & APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Android Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: apps/core
        run: npm install --legacy-peer-deps

      - name: Build Web Assets (Vite)
        working-directory: apps/core
        run: npm run build

      - name: Strip web-only assets
        working-directory: apps/core
        run: |
          rm -rf dist/models dist/kyc-admin.html dist/kyc-admin.html.br dist/kyc-admin.html.gz dist/serve.json
          find dist -name "*.br" -delete
          find dist -name "*.gz" -delete

      - name: Sync Capacitor to Android
        working-directory: apps/core
        run: npx @capacitor/cli sync android

      - name: Make Gradlew Executable
        working-directory: apps/core/android
        run: chmod +x gradlew

      - name: Configure Release Keystore & Signing
        working-directory: apps/core/android
        run: |
          STORE_PASS="${{ secrets.ANDROID_KEYSTORE_PASSWORD || 'zhSybFaaBp5aPZrPZL5kskQYi8IZ' }}"
          KEY_PASS="${{ secrets.ANDROID_KEY_PASSWORD || 'zhSybFaaBp5aPZrPZL5kskQYi8IZ' }}"
          KEY_ALIAS="${{ secrets.ANDROID_KEY_ALIAS || 'ifb-key' }}"

          KEYSTORE_FILE="app/ifb-release-key.jks"
          if [ -f "ifb-release-key.b64" ]; then
            echo "Decoding embedded release signing keystore..."
            base64 -d < ifb-release-key.b64 > "$KEYSTORE_FILE"
          elif [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$KEYSTORE_FILE"
          elif [ -n "${{ secrets.IFB_RELEASE_KEY_BASE64 }}" ]; then
            echo "${{ secrets.IFB_RELEASE_KEY_BASE64 }}" | base64 -d > "$KEYSTORE_FILE"
          elif [ -f "app/ifb-upload-key.jks" ]; then
            KEYSTORE_FILE="app/ifb-upload-key.jks"
          fi

          if [ -f "play-store-key.b64" ]; then
            echo "Decoding Google Play service account key..."
            base64 -d < play-store-key.b64 > play-store-key.json
          elif [ -n "${{ secrets.PLAY_STORE_JSON_KEY }}" ]; then
            echo "${{ secrets.PLAY_STORE_JSON_KEY }}" > play-store-key.json
          fi

          KEYSTORE_NAME=$(basename "$KEYSTORE_FILE")

          cat << EOF > keystore.properties
          storeFile=$KEYSTORE_NAME
          storePassword=$STORE_PASS
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASS
          EOF

          # Export public certificate and SHA256 fingerprints
          keytool -export -rfc \
            -keystore "$KEYSTORE_FILE" \
            -alias "$KEY_ALIAS" \
            -storepass "$STORE_PASS" \
            -file app/upload_certificate.pem

          keytool -list -v \
            -keystore "$KEYSTORE_FILE" \
            -alias "$KEY_ALIAS" \
            -storepass "$STORE_PASS" > app/signing_fingerprints.txt

      - name: Build Signed Release Bundle (.aab) & APK
        working-directory: apps/core/android
        env:
          GRADLE_OPTS: "-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+UseG1GC"
        run: |
          ./gradlew bundleRelease --stacktrace
          ./gradlew assembleRelease --stacktrace

      - name: Sign & Verify Android App Bundle (.aab)
        working-directory: apps/core/android
        run: |
          STORE_PASS="${{ secrets.ANDROID_KEYSTORE_PASSWORD || 'zhSybFaaBp5aPZrPZL5kskQYi8IZ' }}"
          KEY_PASS="${{ secrets.ANDROID_KEY_PASSWORD || 'zhSybFaaBp5aPZrPZL5kskQYi8IZ' }}"
          KEY_ALIAS="${{ secrets.ANDROID_KEY_ALIAS || 'ifb-key' }}"

          AAB_FILE=$(ls app/build/outputs/bundle/release/*.aab | head -n 1)
          echo "Target AAB: $AAB_FILE"
          KEYSTORE_FILE="app/ifb-release-key.jks"
          if [ ! -f "$KEYSTORE_FILE" ] && [ -f "app/ifb-upload-key.jks" ]; then
            KEYSTORE_FILE="app/ifb-upload-key.jks"
          fi
          jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 \
            -keystore "$KEYSTORE_FILE" \
            -storepass "$STORE_PASS" \
            -keypass "$KEY_PASS" \
            "$AAB_FILE" "$KEY_ALIAS"
          echo "Verifying AAB Signature:"
          jarsigner -verify "$AAB_FILE"

      - name: Upload Signed Android App Bundle (.aab for Google Play Console)
        uses: actions/upload-artifact@v4
        with:
          name: ifb-signed-playstore-aab
          path: apps/core/android/app/build/outputs/bundle/release/*.aab

      - name: Upload Installable APK (Release)
        uses: actions/upload-artifact@v4
        with:
          name: ifb-installable-release-apk
          path: apps/core/android/app/build/outputs/apk/release/*.apk

      - name: Upload Signing Keystore & Certificates (Save for future updates)
        uses: actions/upload-artifact@v4
        with:
          name: ifb-signing-keystore-credentials
          path: |
            apps/core/android/app/*.jks
            apps/core/android/app/upload_certificate.pem
            apps/core/android/app/signing_fingerprints.txt
            apps/core/android/keystore.properties

      - name: Deploy to Google Play Console (Internal Track)
        if: ${{ hashFiles('apps/core/android/play-store-key.b64') != '' }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJson: apps/core/android/play-store-key.json
          packageName: org.infinitefuturebank.deus
          releaseFiles: apps/core/android/app/build/outputs/bundle/release/*.aab
          track: internal
          status: completed
