name: Build Android App Bundle & APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Android Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: apps/core
        run: npm install --legacy-peer-deps

      - name: Build Web Assets (Vite)
        working-directory: apps/core
        run: npm run build

      - name: Strip web-only assets
        working-directory: apps/core
        run: |
          rm -rf dist/models dist/kyc-admin.html dist/kyc-admin.html.br dist/kyc-admin.html.gz dist/serve.json
          find dist -name "*.br" -delete
          find dist -name "*.gz" -delete

      - name: Sync Capacitor to Android
        working-directory: apps/core
        run: npx @capacitor/cli sync android

      - name: Make Gradlew Executable
        working-directory: apps/core/android
        run: chmod +x gradlew

      - name: Build Release Bundle (.aab) & APKs
        working-directory: apps/core/android
        run: |
          ./gradlew bundleRelease assembleRelease assembleDebug --stacktrace

      - name: Upload Android App Bundle (.aab for Google Play Console)
        uses: actions/upload-artifact@v4
        with:
          name: ifb-playstore-bundle-aab
          path: apps/core/android/app/build/outputs/bundle/release/*.aab

      - name: Upload Installable APKs (Debug & Release)
        uses: actions/upload-artifact@v4
        with:
          name: ifb-installable-apks
          path: |
            apps/core/android/app/build/outputs/apk/release/*.apk
            apps/core/android/app/build/outputs/apk/debug/*.apk
