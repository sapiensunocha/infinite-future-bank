name: Build Android App Bundle & APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'apps/core/**'
      - '.github/workflows/build-android.yml'

jobs:
  build:
    name: Build Android Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'apps/core/package-lock.json'

      - name: Install dependencies
        working-directory: apps/core
        run: npm ci --legacy-peer-deps || npm install

      - name: Build Web Assets (Vite)
        working-directory: apps/core
        run: npm run build

      - name: Sync Capacitor to Android
        working-directory: apps/core
        run: npx @capacitor/cli sync android

      - name: Make Gradlew Executable
        working-directory: apps/core/android
        run: chmod +x gradlew

      - name: Build Release AAB & APK
        working-directory: apps/core/android
        run: ./gradlew assembleRelease bundleRelease --stacktrace

      - name: Upload Android App Bundle (.aab for Google Play)
        uses: actions/upload-artifact@v4
        with:
          name: ifb-release-aab
          path: apps/core/android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: warn

      - name: Upload Release APK (.apk for Direct Testing)
        uses: actions/upload-artifact@v4
        with:
          name: ifb-release-apk
          path: apps/core/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
