// ── Helpers ───────────────────────────────────────────────────
async function callEdge(fn, body, token) {
  const r = await fetch(`${SUPABASE_URL}/functions/v1/${fn}`, {
    method:'POST',
    headers:{'Content-Type':'application/json','apikey':ANON_KEY,'Authorization':`Bearer ${ANON_KEY}`,'x-kyc-admin-token':token||''},
    body:JSON.stringify(body),
  });
  return r.json();
}

function getSession() {
  try {
    const s = JSON.parse(sessionStorage.getItem('kyc_admin_session')||'null');
    if (!s||s.exp<Date.now()){sessionStorage.removeItem('kyc_admin_session');return null;}
    return s;
  } catch {return null;}
}

let termsOk=false;
function toggleTerms(){
  termsOk=!termsOk;
  const b=document.getElementById('tb');
  if(b){b.style.background=termsOk?'#2563eb':'';b.style.borderColor=termsOk?'#2563eb':'#475569';b.innerHTML=termsOk?'<span style="color:#fff;font-size:11px">✓</span>':'';}
}
function bindLogin(){
  termsOk=false;
  document.getElementById('lf')?.addEventListener('submit',async e=>{
    e.preventDefault();
    if(!termsOk){set({error:tx().must_accept});return;}
    const email=document.getElementById('le').value.trim().toLowerCase();
    const pass=document.getElementById('lp').value;
    set({loading:true,error:''});
    try{
      const r=await callEdge('kyc-admin-auth',{email,passcode:pass,acceptedTerms:true});
      if(r.error){set({loading:false,error:r.error});return;}
      const s={...r.admin,token:r.token,exp:Date.now()+8*60*60*1000};
      sessionStorage.setItem('kyc_admin_session',JSON.stringify(s));
      set({session:s,loading:false,view:'projects'});
    }catch{set({loading:false,error:tx().conn_err});}
  });
}
function logout(){sessionStorage.removeItem('kyc_admin_session');set({session:null,error:''});}

function selTier(id){
  document.getElementById('tv').value=id;
  TIERS.forEach(ti=>{
    const el=document.getElementById(`t_${ti.id}`);
    if(!el)return;
    el.style.borderColor=ti.id===id?'#2563eb':'rgba(100,116,139,.3)';
    el.style.background=ti.id===id?'rgba(37,99,235,.15)':'#1a2035';
  });
}

function bindNew(){
  document.getElementById('pf')?.addEventListener('submit',async e=>{
    e.preventDefault();
    const d=Object.fromEntries(new FormData(e.target).entries());
    if(!d.payment_tier){set({error:tx().sel_tier});return;}
    set({loading:true,error:''});
    try{
      const r=await callEdge('kyc-register-project',{
        founder_name:d.founder_name, founder_email:d.founder_email,
        founder_phone:d.founder_phone, founder_country:d.country,
        project_type:d.project_type, stage:d.stage, sector:d.sector,
        business_description:d.business_description,
        revenue_model:d.revenue_model, team_size:d.team_size,
        website:d.website,
        funding_amount_needed:d.financing_amount,
        funding_currency:d.financing_currency,
        payment_tier:d.payment_tier,
        activation_fee:ACTIVATION_FEE,
        activation_currency:ACTIVATION_CURRENCY,
      },S.session.token);
      if(r.error){set({loading:false,error:r.error});return;}
      listLoaded=false;
      set({loading:false,view:'projects',error:''});
    }catch{set({loading:false,error:tx().conn_err});}
  });
}

      <p style="color:#60a5fa;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.1em;border-top:1px solid rgba(100,116,139,.2);padding-top:14px">${t.s_project||'Projet'}</p>

        ${lbl(t.biz_stage, sel('stage', Object.entries(t.stages_biz).map(([v,l])=>[v,l]), p.stage))}
        ${lbl(t.sector, sel('sector', [['',t.sel_sector],...t.sectors.map(s=>[s,s])], p.sector))}
        ${lbl(t.website, inp('website', p.website, 'https://'))}

        ${lbl(t.amount_req, inp('funding_amount_needed', p.funding_amount_needed, '500000', 'number'))}
      </div>

      <button type="submit" class="btn-primary" style="width:100%;padding:14px;margin-top:4px">

function bindDetail(){
  // Init Stripe when payment tab is active
  if(S.tab==='payment'){
    setTimeout(()=>{
      if(!_stripe) _stripe=Stripe(STRIPE_PK);
      if(document.getElementById('card-element')){
        const els=_stripe.elements({appearance:{theme:'night',variables:{colorPrimary:'#2563eb',colorBackground:'#1a2035',colorText:'#ffffff',colorTextPlaceholder:'#475569',fontFamily:'Inter,system-ui,sans-serif'}}});
        _cardEl=els.create('card');
        _cardEl.mount('#card-element');
        _cardEl.on('change',e=>{const err=document.getElementById('card-errors');if(err)err.textContent=e.error?.message||'';});
      }
    },80);
  }

  // Edit form
  document.getElementById('editf')?.addEventListener('submit',async e=>{
    e.preventDefault();
    const d=Object.fromEntries(new FormData(e.target).entries());
    set({loading:true,editMsg:'',error:''});
    const updates={
      founder_name:d.founder_name,
      founder_email:d.founder_email,
      founder_phone:d.founder_phone||null,
      founder_country:d.founder_country||null,
      project_type:d.project_type,
      stage:d.stage,
      sector:d.sector||null,
      website:d.website||null,
      business_description:d.business_description||null,
      revenue_model:d.revenue_model||null,
      team_size:d.team_size?parseInt(d.team_size):null,
      funding_amount_needed:d.funding_amount_needed?Number(d.funding_amount_needed):null,
      status:d.status,
    };
    try{
      const r=await callEdge('kyc-update-project',{
        project_id:S.selected.id,
        updates,
        action:'project_edited',
      },S.session.token);
      if(r.error){set({loading:false,error:r.error,tab:'edit'});return;}
      Object.assign(S.selected, updates);
      listLoaded=false;
      set({loading:false,editMsg:tx().edit_ok,error:''});
    }catch{set({loading:false,error:tx().conn_err,tab:'edit'});}
  });
}

let selectedFile=null;
function handleFileSelected(){
  const f=document.getElementById('doc_file')?.files?.[0];
  if(!f)return;
  selectedFile=f;
  const nd=document.getElementById('file_name_display');
  const ub=document.getElementById('do_upload_btn');
  if(nd)nd.textContent=`📎 ${f.name} (${(f.size/1024).toFixed(0)} KB)`;
  if(ub)ub.style.display='block';
}

async function doUpload(){
  const docType=document.getElementById('doc_type')?.value;
  if(!docType){set({error:tx().sel_doc_type,uploadMsg:''});return;}
  if(!selectedFile){return;}
  set({uploading:true,uploadMsg:'',error:''});
  try{
    // Get signed upload URL
    const r=await callEdge('kyc-get-upload-url',{
      project_id:S.selected.id,
      doc_type:docType,
      file_name:selectedFile.name,
      file_size:selectedFile.size,
    },S.session.token);
    if(r.error){set({uploading:false,error:r.error});return;}

    // Upload file directly to Supabase Storage
    const upload=await fetch(r.signed_url,{
      method:'PUT',
      headers:{'Content-Type':selectedFile.type||'application/octet-stream','x-upsert':'true'},
      body:selectedFile,
    });
    if(!upload.ok){set({uploading:false,error:`Upload failed: ${upload.status}`});return;}

    // Add doc to local state
    if(!S.selected.kyc_project_documents)S.selected.kyc_project_documents=[];
    S.selected.kyc_project_documents.push({
      id:r.doc_id, doc_type:docType,
      file_name:selectedFile.name, file_size:selectedFile.size,
      file_url:`${SUPABASE_URL}/storage/v1/object/public/kyc-documents/${r.path}`,
      uploaded_at:new Date().toISOString(),
    });
    selectedFile=null;
    listLoaded=false;
    set({uploading:false,uploadMsg:tx().upload_ok,error:''});
  }catch(e){set({uploading:false,error:'Erreur de téléversement: '+e.message});}
}

// ── Payment method tab switcher (DOM-only, no re-render) ──────
function payTab(m){
  ['stripe','offline','bank','cash'].forEach(id=>{
    const el=document.getElementById('pay_'+id);
    const btn=document.getElementById('ptab_'+id);
    if(el) el.style.display=(id===m)?'block':'none';
    if(btn){
      btn.style.borderColor=(id===m)?'#2563eb':'rgba(100,116,139,.3)';
      btn.style.background=(id===m)?'rgba(37,99,235,.2)':'#1a2035';
      btn.style.color=(id===m)?'#fff':'#64748b';
    }
  });
  if(m==='stripe'&&!_cardEl){
    if(!_stripe)_stripe=Stripe(STRIPE_PK);
    const els=_stripe.elements({appearance:{theme:'night',variables:{colorPrimary:'#2563eb',colorBackground:'#1a2035',colorText:'#ffffff',colorTextPlaceholder:'#475569',fontFamily:'Inter,system-ui,sans-serif'}}});
    _cardEl=els.create('card');
    _cardEl.mount('#card-element');
    _cardEl.on('change',e=>{const err=document.getElementById('card-errors');if(err)err.textContent=e.error?.message||'';});
  }
}

function selPayTier(id){
  document.getElementById('selected_tier').value=id;
  TIERS.forEach(ti=>{
    const el=document.getElementById('ptier_'+ti.id);
    if(!el)return;
    el.style.borderColor=ti.id===id?'#2563eb':'rgba(100,116,139,.3)';
  });
}

function _getPayTier(){return document.getElementById('selected_tier')?.value||S.selected?.payment_tier||'sme';}

function _onPaySuccess(payment){
  S.selected.status='active';
  S.selected.venturex_stage='intake';
  if(!S.selected.kyc_project_payments)S.selected.kyc_project_payments=[];
  S.selected.kyc_project_payments.push(payment);
  listLoaded=false;
  const fr=S.lang==='fr';
  set({loading:false,uploading:false,payMsg:'✓ '+(fr?'Paiement confirmé — compte activé':'Payment confirmed — account activated'),error:''});
}

// ── Stripe Card Payment ───────────────────────────────────────
async function payWithStripe(){
  if(!_stripe||!_cardEl){set({error:'Stripe non initialisé. Cliquez sur "Carte bancaire" d\'abord.'});return;}
  const btn=document.getElementById('stripe-pay-btn');
  if(btn){btn.disabled=true;btn.textContent='⏳ Traitement…';}
  set({loading:true,payMsg:'',error:''});
  try{
    const r=await callEdge('kyc-create-payment-intent',{
      project_id:S.selected.id,
      amount_eur:153,
      founder_name:S.selected.founder_name,
      founder_email:S.selected.founder_email,
    },S.session.token);
    if(r.error){set({loading:false,error:r.error,tab:'payment'});if(btn)btn.disabled=false;return;}

    const {error:stripeErr,paymentIntent}=await _stripe.confirmCardPayment(r.client_secret,{
      payment_method:{card:_cardEl,billing_details:{name:S.selected.founder_name||'',email:S.selected.founder_email||''}},
    });
    if(stripeErr){set({loading:false,error:stripeErr.message,tab:'payment'});if(btn)btn.disabled=false;return;}

    if(paymentIntent.status==='succeeded'){
      const r2=await callEdge('kyc-record-payment',{
        project_id:S.selected.id,
        amount:153,currency:'EUR',
        tier:_getPayTier(),
        payment_method:'stripe',
        reference:paymentIntent.id,
      },S.session.token);
      if(r2.error){set({loading:false,error:r2.error,tab:'payment'});return;}
      _onPaySuccess(r2.payment);
    }
  }catch(e){set({loading:false,error:'Stripe: '+e.message,tab:'payment'});if(btn)btn.disabled=false;}
}

// ── Orange Money / Mobile Money ───────────────────────────────
function omFileSelected(){
  const f=document.getElementById('om_proof_file')?.files?.[0];
  if(!f)return;
  _omProofFile=f;
  const lbl=document.getElementById('om_file_label');
  if(lbl)lbl.textContent=`📎 ${f.name} (${(f.size/1024).toFixed(0)} KB)`;
}

async function payWithMobileMoney(){
  const ref=document.getElementById('om_ref')?.value?.trim();
  const network=document.getElementById('om_network')?.value||'orange_money';
  const amount=Number(document.getElementById('om_amount')?.value)||ACTIVATION_FEE;
  if(!ref){set({error:S.lang==='fr'?'Numéro de transaction requis':'Transaction ID required',tab:'payment'});return;}

  set({uploading:true,payMsg:'',error:''});
  let proofUrl=null;

  try{
    // Upload proof screenshot if provided
    if(_omProofFile){
      const ur=await callEdge('kyc-get-upload-url',{
        project_id:S.selected.id,
        doc_type:'payment_proof',
        file_name:'proof_'+_omProofFile.name,
        file_size:_omProofFile.size,
      },S.session.token);
      if(!ur.error){
        const up=await fetch(ur.signed_url,{method:'PUT',headers:{'Content-Type':_omProofFile.type||'image/jpeg','x-upsert':'true'},body:_omProofFile});
        if(up.ok){
          proofUrl=`${SUPABASE_URL}/storage/v1/object/public/kyc-documents/${ur.path}`;
          if(!S.selected.kyc_project_documents)S.selected.kyc_project_documents=[];
          S.selected.kyc_project_documents.push({id:ur.doc_id,doc_type:'payment_proof',file_name:_omProofFile.name,file_url:proofUrl,uploaded_at:new Date().toISOString()});
        }
      }
    }

    const r=await callEdge('kyc-record-payment',{
      project_id:S.selected.id,
      amount,currency:'XOF',
      tier:_getPayTier(),
      payment_method:'offline',
      reference:`${network}:${ref}`,
      payment_proof_url:proofUrl,
    },S.session.token);
    if(r.error){set({uploading:false,error:r.error,tab:'payment'});return;}
    _omProofFile=null;
    _onPaySuccess(r.payment);
  }catch(e){set({uploading:false,error:'Erreur: '+e.message,tab:'payment'});}
}

// ── Bank Transfer ─────────────────────────────────────────────
async function payManual(method,refId,amountId){
  const ref=document.getElementById(refId)?.value?.trim()||'';
  const amount=Number(document.getElementById(amountId)?.value)||ACTIVATION_FEE;

      amount,currency:'XOF',
      tier:_getPayTier(),
      payment_method:method,
      reference:ref||undefined,

    _onPaySuccess(r.payment);
  }catch{set({loading:false,error:tx().conn_err,tab:'payment'});}
}

async function payManualCash(){
  const mode=document.getElementById('cash_mode')?.value||'offline';

      project_id:S.selected.id,
      amount,currency:'XOF',
      tier:_getPayTier(),
      payment_method:mode,
      reference:ref||undefined,
    },S.session.token);
    if(r.error){set({loading:false,error:r.error,tab:'payment'});return;}
    _onPaySuccess(r.payment);
  }catch{set({loading:false,error:tx().conn_err,tab:'payment'});}
}
