name: Build Android App Bundle & APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Android Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: apps/core
        run: npm install --legacy-peer-deps

      - name: Build Web Assets (Vite)
        working-directory: apps/core
        run: npm run build

      - name: Strip web-only assets
        working-directory: apps/core
        run: |
          rm -rf dist/models dist/kyc-admin.html dist/kyc-admin.html.br dist/kyc-admin.html.gz dist/serve.json
          find dist -name "*.br" -delete
          find dist -name "*.gz" -delete

      - name: Sync Capacitor to Android
        working-directory: apps/core
        run: npx @capacitor/cli sync android

      - name: Make Gradlew Executable
        working-directory: apps/core/android
        run: chmod +x gradlew

      - name: Configure Release Keystore & Signing
        working-directory: apps/core/android
        run: |
          # Priority:
          # 1. Base64 keystore from GitHub Secrets (ANDROID_KEYSTORE_BASE64 or IFB_RELEASE_KEY_BASE64)
          # 2. Existing key in app/ifb-release-key.jks or app/ifb-upload-key.jks
          # 3. Generate key using exact release credentials
          KEYSTORE_FILE="app/ifb-release-key.jks"
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$KEYSTORE_FILE"
          elif [ -n "${{ secrets.IFB_RELEASE_KEY_BASE64 }}" ]; then
            echo "${{ secrets.IFB_RELEASE_KEY_BASE64 }}" | base64 -d > "$KEYSTORE_FILE"
          elif [ -f "app/ifb-upload-key.jks" ]; then
            KEYSTORE_FILE="app/ifb-upload-key.jks"
          elif [ ! -f "$KEYSTORE_FILE" ]; then
            keytool -genkeypair -v \
              -keystore "$KEYSTORE_FILE" \
              -alias ifb-key \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass zhSybFaaBp5aPZrPZL5kskQYi8IZ \
              -keypass zhSybFaaBp5aPZrPZL5kskQYi8IZ \
              -dname "CN=Infinite Future Bank, OU=Mobile, O=IFB, L=New York, ST=NY, C=US"
          fi

          KEYSTORE_NAME=$(basename "$KEYSTORE_FILE")

          cat << EOF > keystore.properties
          storeFile=$KEYSTORE_NAME
          storePassword=zhSybFaaBp5aPZrPZL5kskQYi8IZ
          keyAlias=ifb-key
          keyPassword=zhSybFaaBp5aPZrPZL5kskQYi8IZ
          EOF

          # Export public certificate and SHA256 fingerprints
          keytool -export -rfc \
            -keystore "$KEYSTORE_FILE" \
            -alias ifb-key \
            -storepass zhSybFaaBp5aPZrPZL5kskQYi8IZ \
            -file app/upload_certificate.pem

          keytool -list -v \
            -keystore "$KEYSTORE_FILE" \
            -alias ifb-key \
            -storepass zhSybFaaBp5aPZrPZL5kskQYi8IZ > app/signing_fingerprints.txt

      - name: Build Signed Release Bundle (.aab) & APKs
        working-directory: apps/core/android
        run: |
          ./gradlew bundleRelease assembleRelease assembleDebug --stacktrace

      - name: Sign & Verify Android App Bundle (.aab)
        working-directory: apps/core/android
        run: |
          AAB_FILE=$(ls app/build/outputs/bundle/release/*.aab | head -n 1)
          echo "Target AAB: $AAB_FILE"
          KEYSTORE_FILE="app/ifb-release-key.jks"
          if [ ! -f "$KEYSTORE_FILE" ] && [ -f "app/ifb-upload-key.jks" ]; then
            KEYSTORE_FILE="app/ifb-upload-key.jks"
          fi
          jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 \
            -keystore "$KEYSTORE_FILE" \
            -storepass zhSybFaaBp5aPZrPZL5kskQYi8IZ \
            -keypass zhSybFaaBp5aPZrPZL5kskQYi8IZ \
            "$AAB_FILE" ifb-key
          echo "Verifying AAB Signature:"
          jarsigner -verify "$AAB_FILE"

      - name: Upload Signed Android App Bundle (.aab for Google Play Console)
        uses: actions/upload-artifact@v4
        with:
          name: ifb-signed-playstore-aab
          path: apps/core/android/app/build/outputs/bundle/release/*.aab

      - name: Upload Installable APKs (Debug & Release)
        uses: actions/upload-artifact@v4
        with:
          name: ifb-installable-apks
          path: |
            apps/core/android/app/build/outputs/apk/release/*.apk
            apps/core/android/app/build/outputs/apk/debug/*.apk

      - name: Upload Signing Keystore & Certificates (Save for future updates)
        uses: actions/upload-artifact@v4
        with:
          name: ifb-signing-keystore-credentials
          path: |
            apps/core/android/app/*.jks
            apps/core/android/app/upload_certificate.pem
            apps/core/android/app/signing_fingerprints.txt
            apps/core/android/keystore.properties
