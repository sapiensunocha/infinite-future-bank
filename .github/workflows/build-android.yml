name: Build Android App Bundle & APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
  # PRs build an UNSIGNED release (same R8/minify config) so breakage is caught before merge.
  pull_request:
    branches:
      - main

# Least privilege: the workflow only needs to read the repository.
permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Android Release
    runs-on: ubuntu-latest

    steps:
      - name: Verify required signing secrets
        if: github.event_name != 'pull_request'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          missing=0
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_PASSWORD ANDROID_KEY_ALIAS; do
            if [ -z "${!name}" ]; then
              echo "::error::Required secret $name is not set"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] || exit 1

      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      # apps/core is an npm workspace; the root package-lock.json is authoritative.
      - name: Install dependencies (locked)
        run: npm ci --ignore-scripts

      - name: Build Web Assets (Vite)
        working-directory: apps/core
        run: npm run build

      - name: Strip web-only assets
        working-directory: apps/core
        run: |
          rm -rf dist/models dist/kyc-admin.html dist/kyc-admin.html.br dist/kyc-admin.html.gz dist/serve.json
          find dist -name "*.br" -delete
          find dist -name "*.gz" -delete

      - name: Sync Capacitor to Android
        working-directory: apps/core
        run: npx --no-install cap sync android

      - name: Make Gradlew Executable
        working-directory: apps/core/android
        run: chmod +x gradlew

      - name: Configure Release Keystore & Signing
        if: github.event_name != 'pull_request'
        working-directory: apps/core/android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > app/ifb-release-key.jks
          {
            echo "storeFile=ifb-release-key.jks"
            echo "storePassword=$ANDROID_KEYSTORE_PASSWORD"
            echo "keyAlias=$ANDROID_KEY_ALIAS"
            echo "keyPassword=$ANDROID_KEY_PASSWORD"
          } > keystore.properties

      - name: Build Signed Release Bundle (.aab) & APK
        working-directory: apps/core/android
        env:
          GRADLE_OPTS: "-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+UseG1GC"
        run: |
          ./gradlew bundleRelease --stacktrace
          ./gradlew assembleRelease --stacktrace

      - name: Verify Android App Bundle signature
        if: github.event_name != 'pull_request'
        working-directory: apps/core/android
        run: |
          AAB_FILE=$(ls app/build/outputs/bundle/release/*.aab | head -n 1)
          echo "Target AAB: $AAB_FILE"
          jarsigner -verify "$AAB_FILE"

          echo "=== PRE-FLIGHT RELEASE INSPECTION ==="
          APK_FILE=$(ls app/build/outputs/apk/release/*.apk 2>/dev/null | head -n 1)
          if [ -n "$ANDROID_HOME" ]; then
            AAPT_BIN=$(find "$ANDROID_HOME/build-tools" -name aapt 2>/dev/null | sort -V | tail -n 1)
            if [ -x "$AAPT_BIN" ] && [ -f "$APK_FILE" ]; then
              "$AAPT_BIN" dump badging "$APK_FILE" | grep -E "package:|sdkVersion:|targetSdkVersion:"
            fi
          fi

      - name: Upload Signed Android App Bundle (.aab for Google Play Console)
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ifb-signed-playstore-aab
          path: apps/core/android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 14

      - name: Upload Installable APK (Release)
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ifb-installable-release-apk
          path: apps/core/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14

      # Signing material is NEVER uploaded as an artifact. Remove it from the runner.
      - name: Remove signing material
        if: always()
        working-directory: apps/core/android
        run: rm -f app/*.jks keystore.properties play-store-key.json

  deploy-play:
    name: Deploy to Google Play (Internal Track)
    needs: build
    # Manual releases only, gated by the `production` environment
    # (configure required reviewers in Settings > Environments > production).
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Verify required Play secret
        env:
          PLAY_STORE_JSON_KEY: ${{ secrets.PLAY_STORE_JSON_KEY }}
        run: |
          if [ -z "$PLAY_STORE_JSON_KEY" ]; then
            echo "::error::Required secret PLAY_STORE_JSON_KEY is not set"
            exit 1
          fi

      - name: Download signed AAB
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ifb-signed-playstore-aab
          path: release

      - name: Write Play service-account key
        env:
          PLAY_STORE_JSON_KEY: ${{ secrets.PLAY_STORE_JSON_KEY }}
        run: |
          umask 077
          printf '%s' "$PLAY_STORE_JSON_KEY" > "$RUNNER_TEMP/play-store-key.json"

      - name: Upload to Google Play Console
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJson: ${{ runner.temp }}/play-store-key.json
          packageName: org.infinitefuturebank.deus
          releaseFiles: release/*.aab
          track: internal
          status: completed
          # changesNotSentForReview must not be set: this app's changes are sent for review automatically

      - name: Remove Play service-account key
        if: always()
        run: rm -f "$RUNNER_TEMP/play-store-key.json"
