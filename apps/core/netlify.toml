[build]
  base    = "apps/core"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION    = "22"
  NODE_OPTIONS    = "--max-old-space-size=4096"

# Static files that must never be caught by the SPA catch-all
[[redirects]]
  from   = "/sw.js"
  to     = "/sw.js"
  status = 200
  force  = false

[[redirects]]
  from   = "/manifest.json"
  to     = "/manifest.json"
  status = 200
  force  = false

# SPA fallback — all routes without a file extension serve index.html
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200
